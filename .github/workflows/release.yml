name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Resolve version name
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF##refs/tags/}"
          else
            VERSION="manual-$(date +%Y%m%d-%H%M)"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          GRADLE_OPTS: "-Xmx3g -Dfile.encoding=UTF-8"

      - name: Rename APK
        id: artifact
        run: |
          OUT="SongKtv-${{ steps.version.outputs.version }}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          ls -lh "$OUT"

      - name: Upload APK as workflow artifact
        if: always() && steps.artifact.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: SongKtv-${{ steps.version.outputs.version }}
          path: ${{ steps.artifact.outputs.path }}
          retention-days: 30

      - name: Publish GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: SongKtv ${{ steps.version.outputs.version }}
          tag_name: ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: ${{ steps.artifact.outputs.path }}
          fail_on_unmatched_files: true
